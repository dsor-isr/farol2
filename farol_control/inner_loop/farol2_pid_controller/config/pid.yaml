################################
#   Default Parameters
################################
/**:
  pid:
    ros__parameters:
      node_frequency: 10.0
      course_control: false   # set to true to control course angle instead of yaw
      use_heading_rate_as_yaw_rate: false # set to true to use heading_rate instead of orientation_rate.z for yaw PID rate input
      lpf_order: 3
      lpf_method: "tustin"
      lpf_design: "bessel"

      # Speeds (surge, sway, heave)
      surge:
        enabled: false
        kp: 10.0
        ki: 1.0
        use_ref_lpf: true
        lpf_wc: 31.4 # rad/s
        tau_min: -30.0 # N
        tau_max: 30.0 # N
      sway:
        enabled: false
        kp: 1.0
        ki: 1.0
        use_ref_lpf: true
        lpf_wc: 31.4 # rad/s
        tau_min: -20.0 # N
        tau_max: 20.0 # N
      heave:
        enabled: false
        kp: 1.0
        ki: 1.0
        use_ref_lpf: true
        lpf_wc: 31.4 # rad/s
        tau_min: -20.0 # N
        tau_max: 20.0 # N
      # Angles (yaw, pitch, roll)
      yaw:
        debug: true
        enabled: true
        # Following Gains are for:
        #   m_r = 88.0; N_r = 14.0; N_rr = 260.0; xi = 0.7; additional pole @ 10*xi*wn
        # wc = 0.2
        kp: 21.4
        ki: 2.1
        kd: 110.0
        # wc = 0.5
        # kp: 238.8929
        # ki: 77.4190
        # kd: 371.6111
        # wc = 0.6
        # kp: 344.0057
        # ki: 133.7800
        # kd: 445.9334
        # kffv_lin: 14.334052
        # kffv_sq: 260.675031
        # kffa: 88.478840
        kffv_lin: 0.0
        kffv_sq: 0.0
        kffa: 0.0
        use_ref_lpf: true
        lpf_wc: 1.0 # rad/s (2hz about the maximum possible given that sampling is 10hz)
        # lpf_wc: 12.5664 # rad/s (2hz about the maximum possible given that sampling is 10hz)
        tau_min: -6.0  # N.m (actual in simulation is 5.93)
        tau_max: 6.0 # N.m
      pitch:
        enabled: false
        kp: 1.0
        ki: 1.0
        kd: 1.0
        use_ref_lpf: true
        lpf_wc: 3.1416 # rad/s
        tau_min: -10.0 # N.m
        tau_max: 10.0 # N.m
      roll:
        enabled: false
        kp: 1.0
        ki: 1.0
        kd: 1.0
        use_ref_lpf: true
        lpf_wc: 3.1416 # rad/s
        tau_min: -10.0 # N.m
        tau_max: 10.0 # N.m
      # Angle rates (yaw rate, pitch rate, roll rate)
      yaw_rate:
        enabled: false
        kp: 1.0
        ki: 1.0
        use_ref_lpf: true
        lpf_wc: 31.4 # rad/s
        tau_min: -10.0 # N.m
        tau_max: 10.0 # N.m
      pitch_rate:
        enabled: false
        kp: 1.0
        ki: 1.0
        use_ref_lpf: true
        lpf_wc: 31.4 # rad/s
        tau_min: -10.0 # N.m
        tau_max: 10.0 # N.m
      roll_rate:
        enabled: false
        kp: 1.0
        ki: 1.0
        use_ref_lpf: true
        lpf_wc: 31.4 # rad/s
        tau_min: -10.0 # N
        tau_max: 10.0 # N-m

      topics:
        subscribers:
          nav_state: "/vehicle0/nav/filter/state"
          surge_ref: "/vehicle0/control/ref/surge"
          sway_ref: "/vehicle0/control/ref/sway"
          heave_ref: "/vehicle0/control/ref/heave"
          yaw_ref: "/vehicle0/control/ref/yaw"
          pitch_ref: "/vehicle0/control/ref/pitch"
          roll_ref: "/vehicle0/control/ref/roll"
          yaw_rate_ref: "/vehicle0/control/ref/yaw_rate"
          pitch_rate_ref: "/vehicle0/control/ref/pitch_rate"
          roll_rate_ref: "/vehicle0/control/ref/roll_rate"
        publishers:
          thrust_x: "/vehicle0/actuation/thrust_x"
          thrust_y: "/vehicle0/actuation/thrust_y"
          thrust_z: "/vehicle0/actuation/thrust_z"
          torque_x: "/vehicle0/actuation/torque_x"
          torque_y: "/vehicle0/actuation/torque_y"
          torque_z: "/vehicle0/actuation/torque_z"
          debug:
            yaw: "/vehicle0/control/inner_loop/pid/yaw/debug"
        services:
          change_params: "/vehicle0/control/pid/change_params"
          course_control: "/vehicle0/control/pid/course_control"