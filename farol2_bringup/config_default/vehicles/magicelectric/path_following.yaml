  # Path Following configurations
  # Be careful while changing values here, due to the way the PF code is implemented,
  # the order of the following gains must be respected. This means you can't switch
  # the lines k1 and k2 in lapierre, for example.
  /**:
    path_following:
      ros__parameters:
        node_frequency: 10.0
        controller_gains:
          lapierre:
            k1: 1.0
            k2: 0.3
            k3: 0.3
            theta: 0.8
            k_delta: 1.0
          marcelo:
            delta: -1.0
            kx: 0.5
            ky: 0.5
            kz: 0.5
            k_pos: 2.0
            k_currents: 0.2
            rd: [0.0, 0.0, 1.0]
            d: [0.0, 0.0, 0.0]
          aguiar:
            delta: -1.0
            kx: 0.5
            ky: 0.5
            kz: 0.5
            k_pos: 0.5
            k_currents: 0.5
          romulo:
            ke: [0.05, 0.0, 0.0, 0.05]
            kz: 0.2
          pramod:
            kp: 0.02
            ki: 0.0005
          samson:
            k1: 1.0
            k2: 0.3
            k3: 0.3
            theta: 0.8
            k_delta: 1.0
          relative_heading:
            kx: 0.5
            ky: 0.1
            kz: 0.2
            yaw_offset: 0.785
            p_sat: [1.0, 1.0] #x, y
          breivik:
            delta_h: 10.0
          ilos:
            delta: 10.0  # lookahead distance (metres)
            ki: 0.01     # integral gain