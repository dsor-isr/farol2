# SI units; positive resistance coefficients; initial angles/rates in radians.
# Legacy spherical surface approximation retained with densities converted to kg/m^3.
/**:
  vehicle_sim:
    ros__parameters:
      node_frequency: 100
      initial_state:
        position: [0.0, 0.0, 0.0] # Local NED, m; origin is in world_config.
        body_velocity: [0.0, 0.0, 0.0]
        orientation: [0.0, 0.0, 0.0]
        orientation_rate: [0.0, 0.0, 0.0]
        velocity_reference: water
      vehicle:
        mass: 10.5
        inertia_tensor: [1000.0, 1000.0, 4.14]
        linear_damping_tensor: [0.1213, 1.1732, 1.113, 0.5, 0.5, 0.5]
        quadratic_damping_tensor: [23.9, 46.27, 50.278, 1.0, 1.0, 1.0]
        added_mass_tensor: [27.08, 25.952, 29.9081, 1.0, 1.0, 1.0]
        actuators:
          base_frame: base_link
          frames: [thruster_portside_horizontal_back_link, thruster_starboard_horizontal_back_link, thruster_portside_vertical_back_link,
            thruster_starboard_vertical_back_link, thruster_portside_horizontal_front_link, thruster_starboard_horizontal_front_link,
            thruster_portside_vertical_front_link, thruster_starboard_vertical_front_link]
          lump_param_positive: [1.77778e-06, 0.0, 0.0]
          lump_param_negative: [-1.77778e-06, 0.0, 0.0]
          pole: 7.2115
          delay: 0.345
          model: polynomial
          minimum_rpm: -5000.0
          maximum_rpm: 5000.0
          deadzone: 430.0
        center_of_gravity: [0.0, 0.0, 0.0]
        center_of_buoyancy: [0.0, 0.0, 0.0]
        active_dofs: [0, 1, 2, 3, 4, 5]
        restoring: {displaced_volume: 0.0105, sphere_radius: 0.13584184241663852}
      sensor_list: [gnss, imu, dvl, depth_cell, altimeter, thruster_rpm]
      sensor:
        gnss:
          frame: gnss_link
          measure_velocity_over_ground: false
          measure_utm_ned: false
          noise_enabled: false
          position_noise:
            bias: [0.0, 0.0, 0.0]
            standard_deviation: [0.0, 0.0, 0.0]
          velocity_noise:
            bias: [0.0, 0.0, 0.0]
            standard_deviation: [0.0, 0.0, 0.0]
        imu:
          frame: imu_link
          noise_enabled: false
          orientation_noise:
            bias: [0.0, 0.0, 0.0]
            standard_deviation: [0.0, 0.0, 0.0]
          angular_velocity_noise:
            bias: [0.0, 0.0, 0.0]
            standard_deviation: [0.0, 0.0, 0.0]
        dvl:
          frame: dvl_link
          mode: bottom_track
          output_frame: sensor
          noise_enabled: false
          velocity_noise:
            bias: [0.0, 0.0, 0.0]
            standard_deviation: [0.0, 0.0, 0.0]
        depth_cell:
          frame: depth_link
          noise_enabled: false
          position_noise:
            bias: [0.0, 0.0, 0.0]
            standard_deviation: [0.0, 0.0, 0.0]
        altimeter:
          frame: altimeter_link
          period: 20.0  # seconds; synthetic sine wave between 2 and 4 m.
