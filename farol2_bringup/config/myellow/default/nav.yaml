################################
#  Parameters
################################
/**:
  navigation_filter:
    ros__parameters:
      node_frequency: 10.0
      publish_all_steps: true

      filters: 
        - ""
      
      measurements:
        # Subscribe to both DVL modes; only the measured reference is updated.
        - "gnss"
        - "imu"
        - "velocity_over_ground"
        - "velocity_through_water"
        - "depth"
        - "altimeter"
        - "thruster_rpm"

      plugins:
        sample_and_hold:
          initializer_measurements:
            - "gnss"
            - "imu"
