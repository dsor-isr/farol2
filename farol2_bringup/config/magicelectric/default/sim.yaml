# SI units; positive resistance coefficients; initial angles/rates in radians.
# Planar surge/sway/yaw; inactive roll/pitch inertias are placeholders.
# Sway damping remains unestimated. Preserve the identified 4 m rudder arm.
# Rudder Xacro offset is 4.5 m; reconciling geometry is a later task.
# Two physical thrusters receive [port RPM, starboard RPM] from the open-loop controller.
/**:
  vehicle_sim:
    ros__parameters:
      node_frequency: 10
      initial_state:
        position: [0.0, 0.0, 0.0] # Local NED, m; origin is in world_config.
        body_velocity: [0.0, 0.0, 0.0] # Start at rest; motion comes from commands/current.
        orientation: [0.0, 0.0, 0.0]
        orientation_rate: [0.0, 0.0, 0.0]
        velocity_reference: water
      vehicle:
        mass: 3100.0
        center_of_gravity: [0.0, 0.0, 0.0]
        center_of_buoyancy: [0.0, 0.0, 0.0]
        active_dofs: [0, 1, 5]
        inertia_tensor: [1.0, 1.0, 88.47884]
        added_mass_tensor: [0.0, 2.967651, 0.0, 0.0, 0.0, 0.0]
        linear_damping_tensor: [0.0, 500.0, 0.0, 0.0, 0.0, 14.334052]
        quadratic_damping_tensor: [96.227, 1500.0, 0.0, 0.0, 0.0, 260.675031]
        restoring: {displaced_volume: 3.024390243902439, sphere_radius: 0.0}
        actuators:
          model: propeller
          base_frame: base_link
          frames: [thruster_left_link, thruster_right_link] # Port, starboard.
          minimum_rpm: -2200.0
          maximum_rpm: 2200.0
          deadzone: 0.0
          pole: 0.0
          delay: 0.0
          fixed_rpm: false
          fixed_rpm_value: 0.0 # Unused while fixed_rpm is false.
          thrust_coefficient: 0.061461915
          diameter: 0.4318
          pitch: 0.381
          thrust_scale: 1.0 # Each frame represents one physical propeller.
        rudder:
          enabled: true
          position_body: [-4.0, 0.0, 0.0]
          orientation_body: [0.0, 0.0, 0.0]
          joint: base_to_rudder_middle
          command_mode: angle
          command_speed: 0.17453292519943295
          minimum_angle: -0.6108652381980153
          maximum_angle: 0.6108652381980153
          rate_limit: 0.0
          lift_coefficient: 1.398093
          drag_constant: 0.000575
          drag_quadratic: 0.520834
      sensor_list: [gnss, imu, thruster_rpm, control_surface_angle]
      sensor:
        gnss:
          frame: gnss_link
          measure_velocity_over_ground: true
          measure_utm_ned: true
          noise_enabled: false
          position_noise:
            bias: [0.0, 0.0, 0.0]
            standard_deviation: [0.0, 0.0, 0.0]
          velocity_noise:
            bias: [0.0, 0.0, 0.0]
            standard_deviation: [0.0, 0.0, 0.0]
        imu:
          frame: imu_link
          noise_enabled: false
          orientation_noise:
            bias: [0.0, 0.0, 0.0]
            standard_deviation: [0.0, 0.0, 0.0]
          angular_velocity_noise:
            bias: [0.0, 0.0, 0.0]
            standard_deviation: [0.0, 0.0, 0.0]

