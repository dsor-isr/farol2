# SI units; positive resistance coefficients; initial angles/rates in radians.
# Legacy spherical surface approximation retained with densities converted to kg/m^3.
/**:
  vehicle_sim:
    ros__parameters:
      node_frequency: 100
      initial_state:
        position: [0.0, 0.0, 0.0] # Local NED, m; origin is in world_config.
        body_velocity: [0.0, 0.0, 0.0]
        orientation: [0.0, 0.0, 0.0]
        orientation_rate: [0.0, 0.0, 0.0]
        velocity_reference: water
      vehicle:
        mass: 30.0
        inertia_tensor: [1000.0, 1000.0, 4.14]
        linear_damping_tensor: [0.0, 55.1, 4.1879, 3000.0, 3000.0, 4.14]
        quadratic_damping_tensor: [27.5, 101.0, 40.9649, 3000.0, 3000.0, 6.23]
        added_mass_tensor: [20.0, 30.0, 80.088, 0.0, 0.0, 0.5]
        actuators:
          base_frame: base_link
          frames: [thruster_portside_horizontal_link, thruster_starboard_horizontal_link, thruster_portside_vertical_link,
            thruster_starboard_vertical_link]
          lump_param_positive: [1.77778e-06, 0.0, 0.0]
          lump_param_negative: [-1.77778e-06, 0.0, 0.0]
          pole: 7.2115
          delay: 0.345
          model: polynomial
          minimum_rpm: -5000.0
          maximum_rpm: 5000.0
          deadzone: 430.0
        center_of_gravity: [0.0, 0.0, 0.0]
        center_of_buoyancy: [0.0, 0.0, 0.0]
        active_dofs: [0, 1, 2, 3, 4, 5]
        restoring: {displaced_volume: 0.03, sphere_radius: 0.19275732104070495}
      sensor_list: [gnss, imu, depth_cell, altimeter, thruster_rpm]
      sensor:
        gnss:
          frame: gnss_link
          measure_velocity_over_ground: true
          measure_utm_ned: false
          noise_enabled: false
          position_noise:
            bias: [0.0, 0.0, 0.0]
            standard_deviation: [0.0, 0.0, 0.0]
          velocity_noise:
            bias: [0.0, 0.0, 0.0]
            standard_deviation: [0.0, 0.0, 0.0]
        imu:
          frame: imu_link
          noise_enabled: false
          orientation_noise:
            bias: [0.0, 0.0, 0.0]
            standard_deviation: [0.0, 0.0, 0.0]
          angular_velocity_noise:
            bias: [0.0, 0.0, 0.0]
            standard_deviation: [0.0, 0.0, 0.0]
        depth_cell:
          frame: depth_link
          noise_enabled: false
          position_noise:
            bias: [0.0, 0.0, 0.0]
            standard_deviation: [0.0, 0.0, 0.0]
        altimeter:
          frame: altimeter_link
          period: 20.0  # seconds; synthetic sine wave between 2 and 4 m.
